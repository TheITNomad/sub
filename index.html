<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HEAD HUNTER — Subscribe</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}

:root{
  --void:#02000a;
  --maroon:#780012;
  --crimson:#b40018;
  --red:#ff2d2d;
  --green:#00ff41;
  --gold:#f5c842;
  --ice:#e8f4ff;
}

html,body{
  width:100%;height:100%;
  background:var(--void);
  color:#fff;
  font-family:'Share Tech Mono',monospace;
  overflow:hidden;
  user-select:none;
}

/* ── BACKGROUNDS ─────────────────────────────────────── */
#star-canvas{position:fixed;inset:0;z-index:0;}
#matrix-canvas{position:fixed;inset:0;z-index:1;opacity:0.07;pointer-events:none;}
.maroon-glow{
  position:fixed;inset:0;z-index:2;pointer-events:none;
  background:
    radial-gradient(ellipse 80% 70% at 50% 50%,rgba(120,0,18,0.65) 0%,rgba(60,0,8,0.3) 50%,transparent 80%);
}
.scanlines{
  position:fixed;inset:0;z-index:3;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.055) 3px,rgba(0,0,0,0.055) 4px);
}

/* ── CORNERS ─────────────────────────────────────────── */
.corner{position:fixed;width:32px;height:32px;z-index:20;}
.corner.tl{top:20px;left:20px;border-top:1px solid rgba(180,0,24,0.6);border-left:1px solid rgba(180,0,24,0.6);}
.corner.tr{top:20px;right:20px;border-top:1px solid rgba(180,0,24,0.6);border-right:1px solid rgba(180,0,24,0.6);}
.corner.bl{bottom:20px;left:20px;border-bottom:1px solid rgba(180,0,24,0.6);border-left:1px solid rgba(180,0,24,0.6);}
.corner.br{bottom:20px;right:20px;border-bottom:1px solid rgba(180,0,24,0.6);border-right:1px solid rgba(180,0,24,0.6);}

/* ── LIVE BADGE ──────────────────────────────────────── */
.live-badge{
  position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:30;
  display:flex;align-items:center;gap:7px;
  font-size:8px;letter-spacing:4px;color:var(--green);
}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:blink 1.2s ease infinite;}

/* ── SYNC ────────────────────────────────────────────── */
.sync-info{
  position:fixed;bottom:20px;right:24px;z-index:30;
  font-size:7px;letter-spacing:2px;color:rgba(255,255,255,0.18);
}

/* ── STAGE ───────────────────────────────────────────── */
.stage{
  position:relative;z-index:10;
  width:100vw;height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:0;padding:40px 20px 60px;
}

/* ── WORDMARK ────────────────────────────────────────── */
.wordmark{
  font-family:'Orbitron',sans-serif;font-weight:900;
  font-size:clamp(11px,2vw,16px);letter-spacing:10px;
  margin-bottom:8px;
  animation:fadeDown 0.8s ease 0.1s both;
}
.wordmark .r{color:#fff;}
.wordmark .a{color:var(--red);}

/* ── GENESIS ─────────────────────────────────────────── */
.genesis{
  font-family:'Orbitron',sans-serif;font-weight:900;
  font-size:clamp(72px,18vw,180px);
  line-height:0.9;letter-spacing:2px;color:#fff;
  text-shadow:
    0 0 30px rgba(180,0,24,0.9),
    0 0 70px rgba(140,0,18,0.6),
    0 0 140px rgba(100,0,12,0.4);
  animation:fadeDown 0.8s ease 0.15s both;
  margin-bottom:6px;
}

/* ── TAGLINE ─────────────────────────────────────────── */
.tagline{
  font-size: clamp(32px, 6vw, 72px);
  letter-spacing: 8px;
  color: var(--green);
  opacity: 0.85;
  margin-bottom: clamp(28px, 5vh, 48px);
  animation: fadeDown 0.8s ease 0.25s both;
}

/* ── SUB BUTTON ──────────────────────────────────────── */
.sub-wrap{
  display:flex;flex-direction:column;align-items:center;gap:16px;
  animation:fadeUp 0.8s ease 0.4s both;
  margin-bottom:clamp(28px,5vh,48px);
}

.sub-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:14px;
  font-family:'Orbitron',sans-serif;font-weight:900;
  font-size:clamp(14px,2.5vw,22px);
  letter-spacing:clamp(4px,1.5vw,8px);
  text-transform:uppercase;color:#fff;
  text-decoration:none;
  background:linear-gradient(135deg,var(--crimson),var(--maroon));
  border:1px solid rgba(255,45,45,0.6);
  padding:clamp(18px,3vh,28px) clamp(40px,8vw,80px);
  position:relative;overflow:hidden;
  box-shadow:
    0 0 40px rgba(180,0,24,0.8),
    0 0 80px rgba(180,0,24,0.4),
    0 0 160px rgba(180,0,24,0.15),
    inset 0 1px 0 rgba(255,255,255,0.1);
  transition:box-shadow 0.3s ease,transform 0.2s ease;
  cursor:pointer;
}
.sub-btn:hover{
  box-shadow:
    0 0 60px rgba(255,45,45,1),
    0 0 120px rgba(180,0,24,0.7),
    0 0 200px rgba(180,0,24,0.3),
    inset 0 1px 0 rgba(255,255,255,0.15);
  transform:translateY(-3px) scale(1.02);
}
.sub-btn:active{transform:translateY(0) scale(1);}
.sub-btn::before{
  content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.15),transparent);
  animation:shimmer 2.5s linear infinite;
}

/* Play icon */
.play-icon{
  width:clamp(20px,3vw,28px);height:clamp(20px,3vw,28px);
  position:relative;flex-shrink:0;
}
.play-icon::before{
  content:'';position:absolute;inset:0;
  clip-path:polygon(15% 5%, 90% 50%, 15% 95%);
  background:#fff;
}

/* Pulse ring */
.sub-pulse{
  position:absolute;inset:-4px;
  border:1px solid rgba(255,45,45,0.5);
  animation:pulse-ring 2s ease infinite;
  pointer-events:none;
}

/* ── SUB COUNTER ─────────────────────────────────────── */
.counter-wrap{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  animation:fadeUp 0.8s ease 0.55s both;
}

.counter-num{
  font-family:'Orbitron',sans-serif;font-weight:900;
  font-size:clamp(42px,9vw,88px);
  line-height:1;color:#fff;
  text-shadow:0 0 25px rgba(180,0,24,0.8),0 0 60px rgba(180,0,24,0.4);
  letter-spacing:2px;
  transition:all 0.4s ease;
}
.counter-num.tick{animation:num-tick 0.4s ease;}

.counter-label{
  font-size:clamp(8px,1.3vw,11px);letter-spacing:6px;
  color:rgba(255,255,255,0.3);text-transform:uppercase;
}

/* ── PROGRESS BAR ────────────────────────────────────── */
.progress-wrap{
  width:min(500px,85vw);
  display:flex;flex-direction:column;gap:7px;
  margin-top:clamp(16px,3vh,28px);
  animation:fadeUp 0.8s ease 0.65s both;
}
.progress-header{
  display:flex;justify-content:space-between;
  font-size:clamp(7px,1.2vw,9px);letter-spacing:3px;
  color:rgba(255,255,255,0.2);text-transform:uppercase;
}
.progress-pct{
  font-family:'Orbitron',sans-serif;font-size:9px;font-weight:700;
  color:var(--red);
}
.progress-track{
  width:100%;height:3px;
  background:rgba(180,0,24,0.15);
  position:relative;overflow:hidden;
}
.progress-fill{
  height:100%;width:0%;
  background:linear-gradient(90deg,var(--crimson),var(--red));
  box-shadow:0 0 10px rgba(255,45,45,0.6);
  transition:width 1.4s ease;
  position:relative;
}
.progress-fill::after{
  content:'';position:absolute;top:0;left:-40px;width:40px;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.6),transparent);
  animation:shimmer 2s linear infinite;
}

/* ── BOTTOM ──────────────────────────────────────────── */
.bottom-tag{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  font-size:8px;letter-spacing:4px;color:rgba(255,255,255,0.15);
  white-space:nowrap;z-index:20;
}
.bottom-tag span{color:rgba(255,45,45,0.4);}

/* ── ANIMATIONS ──────────────────────────────────────── */
@keyframes fadeDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp  {from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)}}
@keyframes blink   {0%,100%{opacity:1}50%{opacity:0.15}}
@keyframes shimmer {from{left:-100%}to{left:200%}}
@keyframes pulse-ring{
  0%  {transform:scale(1);opacity:0.8;}
  70% {transform:scale(1.06);opacity:0;}
  100%{transform:scale(1.06);opacity:0;}
}
@keyframes num-tick{
  0%  {color:#fff;text-shadow:0 0 25px rgba(180,0,24,0.8);}
  40% {color:#ff8080;text-shadow:0 0 60px rgba(255,45,45,1),0 0 120px rgba(180,0,24,0.8);}
  100%{color:#fff;text-shadow:0 0 25px rgba(180,0,24,0.8);}
}
</style>
</head>
<body>

<canvas id="star-canvas"></canvas>
<canvas id="matrix-canvas"></canvas>
<div class="maroon-glow"></div>
<div class="scanlines"></div>

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<div class="live-badge"><div class="live-dot"></div>SIGNAL ACTIVE</div>
<div class="bottom-tag">head hunter &nbsp;·&nbsp; <span>@TheITNomad</span> &nbsp;·&nbsp; this is only the beginning _</div>
<div class="sync-info" id="sync-info">SYNC IN 600s</div>

<div class="stage">

  <!-- WORDMARK -->
  <div class="wordmark"><span class="r">VENGEFUL</span><span class="a">ONES</span></div>

  <!-- GENESIS -->
  <div class="genesis">HEAD</div>
  <!-- GENESIS -->
  <div class="genesis">HUNTER</div>
<br>
  <div class="tagline">NOMAD</div>

  <!-- BIG SUBSCRIBE BUTTON -->
  <div class="sub-wrap">
    <a class="sub-btn" href="https://www.youtube.com/@TheITNomad?sub_confirmation=1" target="_blank" rel="noopener">
      <div class="sub-pulse"></div>
      <div class="play-icon"></div>
      SUBSCRIBE
    </a>
  </div>

  <!-- SUB COUNTER -->
  <div class="counter-wrap">
    <div class="counter-num" id="sub-count">—</div>
    <div class="counter-label">Subscribers</div>
  </div>

  <!-- PROGRESS BAR -->
  <div class="progress-wrap">
    <div class="progress-header">
      <span>LAUNCH GOAL</span>
      <span class="progress-pct" id="sub-pct">0%</span>
      <span>TARGET: <span id="goal-label">50</span></span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="sub-fill"></div>
    </div>
  </div>

</div>

<script>
// ============================================================
// CONFIG
// ============================================================
const API_KEY    = 'AIzaSyC7o4QatTDalAcKFBc30CLEyrsPonSrE08';
const CHANNEL_ID = 'UCngdjivpUyeBYwyFm_pxTfQ';
const SUB_GOAL   = 500;
const SYNC_INTERVAL = 600000; // seconds

// ============================================================
// SUB COUNTER
// ============================================================
let syncTimer = SYNC_INTERVAL;
let lastCount = null;

async function fetchSubs(){
  try{
    const res  = await fetch(`https://www.googleapis.com/youtube/v3/channels?part=statistics&id=${CHANNEL_ID}&key=${API_KEY}`);
    const data = await res.json();
    if(data.error){ console.warn('YouTube API:', data.error.message); return; }

    const subs = parseInt(data.items[0].statistics.subscriberCount, 10);
    const el   = document.getElementById('sub-count');
    const str  = subs.toLocaleString();

    if(str !== el.textContent){
      el.textContent = str;
      el.classList.remove('tick');
      void el.offsetWidth;
      el.classList.add('tick');
    }

    const pct = Math.min((subs / SUB_GOAL) * 100, 100);
    document.getElementById('sub-fill').style.width  = pct + '%';
    document.getElementById('sub-pct').textContent   = pct.toFixed(1) + '%';
    document.getElementById('goal-label').textContent = SUB_GOAL;

    syncTimer = SYNC_INTERVAL;
  } catch(e){
    console.warn('Fetch error:', e);
  }
}

// Countdown + auto-sync
setInterval(()=>{
  syncTimer--;
  if(syncTimer <= 0){ syncTimer = SYNC_INTERVAL; fetchSubs(); }
  document.getElementById('sync-info').textContent = `SYNC IN ${String(syncTimer).padStart(3,'0')}s`;
}, 1000);

fetchSubs();

// ============================================================
// STARFIELD
// ============================================================
(function(){
  const canvas = document.getElementById('star-canvas');
  const ctx    = canvas.getContext('2d');
  let stars    = [];

  function resize(){
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    initStars();
  }
  function initStars(){
    stars = [];
    const count = Math.floor((canvas.width * canvas.height) / 3500);
    for(let i = 0; i < count; i++){
      const t = Math.random();
      let color;
      if(t < 0.60)      color = [255,255,255];
      else if(t < 0.72) color = [200,220,255];
      else if(t < 0.82) color = [0,212,255];
      else if(t < 0.92) color = [255,100,80];
      else               color = [255,180,120];
      stars.push({
        x:     Math.random() * canvas.width,
        y:     Math.random() * canvas.height,
        size:  Math.random() < 0.85 ? 1 : Math.random() < 0.7 ? 1.5 : 2.5,
        alpha: 0.3 + Math.random() * 0.7,
        phase: Math.random() * Math.PI * 2,
        speed: 0.005 + Math.random() * 0.02,
        color,
      });
    }
  }
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    stars.forEach(s=>{
      s.phase += s.speed;
      const a = s.alpha * (0.5 + 0.5 * Math.sin(s.phase));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
      ctx.fillStyle = `rgba(${s.color[0]},${s.color[1]},${s.color[2]},${a.toFixed(2)})`;
      ctx.fill();
    });
  }
  resize();
  window.addEventListener('resize', resize);
  setInterval(draw, 40);
})();

// ============================================================
// MATRIX RAIN
// ============================================================
(function(){
  const canvas   = document.getElementById('matrix-canvas');
  const ctx      = canvas.getContext('2d');
  const KANA     = 'アイウエオカキクケコサシスセソタチツテトナニヌネノ01';
  const FONT_SIZE = 12;
  const TRAIL_LEN = 16;
  let streams    = [];

  function resize(){
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    const cols = Math.floor(canvas.width / FONT_SIZE);
    streams = [];
    for(let i = 0; i < cols; i++){
      streams.push({
        x:     i * FONT_SIZE,
        y:     -Math.floor(Math.random() * 30),
        speed: 0.3 + Math.random() * 0.3,
        chars: Array.from({length:TRAIL_LEN}, ()=>KANA[Math.floor(Math.random()*KANA.length)]),
      });
    }
  }
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.font = FONT_SIZE + 'px Share Tech Mono,monospace';
    streams.forEach(s=>{
      for(let t = 0; t < TRAIL_LEN; t++){
        const drawY = Math.floor(s.y - t) * FONT_SIZE;
        if(drawY < 0 || drawY > canvas.height) continue;
        if(t === 0){
          ctx.fillStyle   = '#ffffff';
          ctx.shadowColor = '#00ff41';
          ctx.shadowBlur  = 6;
        } else {
          const fade = 1 - t / TRAIL_LEN;
          const g    = Math.floor(180 * fade + 40);
          ctx.fillStyle  = `rgba(0,${g},30,${(fade*0.9).toFixed(2)})`;
          ctx.shadowBlur = 0;
        }
        ctx.fillText(s.chars[t % TRAIL_LEN], s.x, drawY);
      }
      ctx.shadowBlur = 0;
      s.y += s.speed;
      if((s.y - TRAIL_LEN) * FONT_SIZE > canvas.height){
        s.y     = -Math.floor(Math.random() * 6);
        s.speed = 0.3 + Math.random() * 0.25;
      }
    });
  }
  resize();
  window.addEventListener('resize', resize);
  setInterval(draw, 40);
})();
</script>
</body>
</html>
