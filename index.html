<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d12">
<title>NÖMÄD — Tactical Frame V2 — Marquee</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
  body{display:grid;place-items:center}
  #stage{position:relative;width:min(100vw,177.777778vh);aspect-ratio:16/9;overflow:hidden;background:transparent;isolation:isolate}
  #frame{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
  /* Preview is opt-in. Never show a checkerboard on a live overlay. */
  body.preview{background:#111820}
  body.preview #stage{background-color:#18232d;background-image:linear-gradient(45deg,#24303a 25%,transparent 25%),linear-gradient(-45deg,#24303a 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#24303a 75%),linear-gradient(-45deg,transparent 75%,#24303a 75%);background-size:36px 36px;background-position:0 0,0 18px,18px -18px,-18px 0}
  #preview-tag{display:none;position:fixed;left:16px;bottom:16px;z-index:5;padding:9px 12px;border:1px solid #60717e;border-radius:5px;color:#c8d5de;background:#101820;font:12px/1.5 system-ui,sans-serif}
  body.preview #preview-tag{display:block}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}

  /* V2 MARQUEE: isolated within the approved bottom bar; frame SVG unchanged. */
  #marquee-slot{position:absolute;left:35%;width:30%;top:97.35%;height:1.9%;overflow:hidden;pointer-events:none;display:flex;align-items:center;justify-content:center;z-index:2}
  #marquee-message{font-family:Arial,Helvetica,sans-serif;font-size:clamp(7px,1.15vw,17px);font-weight:700;letter-spacing:.13em;color:#dcebf0;text-shadow:0 0 8px #6dabb3;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;opacity:0;transform:translateY(110%);transition:opacity .65s ease,transform .65s ease;text-align:center}
  #marquee-message.visible{opacity:1;transform:translateY(0)}
  #marquee-message.leaving{opacity:0;transform:translateY(-110%)}
  #marquee-led{position:absolute;left:33.9%;top:98.03%;width:.27%;height:.42%;border-radius:50%;background:#a6d4da;box-shadow:0 0 5px #b8e9ef;opacity:.15;transition:opacity .5s;pointer-events:none}
  #marquee-led.active{opacity:1}
  @media (prefers-reduced-motion:reduce){#marquee-message{transition:none}}
</style>
</head>
<body>
<div id="stage" aria-label="NÖMÄD transparent tactical stream overlay">
<svg id="frame" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Minimal tactical overlay with transparent gameplay center">
 <defs>
  <linearGradient id="titanium" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#222d36"/><stop offset=".3" stop-color="#111a22"/><stop offset=".65" stop-color="#080f16"/><stop offset="1" stop-color="#1a252e"/></linearGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5b6870"/><stop offset=".23" stop-color="#b5c2ca"/><stop offset=".48" stop-color="#eef2f4"/><stop offset=".73" stop-color="#9aaab5"/><stop offset="1" stop-color="#48555f"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#566e77"/><stop offset=".5" stop-color="#b6d4d6"/><stop offset="1" stop-color="#566e77"/></linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26333e"/><stop offset=".16" stop-color="#0c151d"/><stop offset="1" stop-color="#070d13"/></linearGradient>
  <filter id="textShadow" x="-20%" y="-80%" width="140%" height="260%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity=".9"/></filter>
 </defs>
 <!-- Top is a solid edge-to-edge header. Gameplay center is NOT filled. -->
 <path d="M0 0H1920V66H1268L1246 78H674L652 66H0Z" fill="url(#bar)"/>
 <path d="M0 0H1920" stroke="#8798a1" stroke-opacity=".75" stroke-width="2"/>
 <path d="M0 65H652L674 77H1246L1268 65H1920" fill="none" stroke="#7f959f" stroke-width="2" stroke-opacity=".8"/>
 <path d="M0 58H570M1350 58H1920" stroke="#293e49" stroke-width="2"/>
 <!-- Ultra-thin rails, absolutely straight, far outer edge. -->
 <path d="M2 66V1015M1918 66V1015" fill="none" stroke="#253641" stroke-width="4"/>
 <path d="M2 66V1015M1918 66V1015" fill="none" stroke="#91a7b1" stroke-opacity=".8" stroke-width="1"/>
 <!-- Low-profile flush bottom bar. -->
 <path d="M0 1015H650L675 1004H1245L1270 1015H1920V1080H0Z" fill="url(#titanium)"/>
 <path d="M0 1015H650L675 1004H1245L1270 1015H1920" fill="none" stroke="#708792" stroke-width="2"/>
 <path d="M0 1078H1920" stroke="#9aaab4" stroke-opacity=".7" stroke-width="2"/>
 <!-- Restrained symmetric header geometry -->
 <g fill="none" stroke="#58717e" stroke-width="2" opacity=".8">

  <path d="M24 43H390"/><path d="M1896 43H1530"/>
 </g>
 <g fill="#8da5b0" opacity=".85"><path d="M28 25H50V30H28Z M57 25H69V30H57Z M76 25H88V30H76Z"/><path d="M1892 25H1870V30H1892Z M1863 25H1851V30H1863Z M1844 25H1832V30H1844Z"/></g>
 <g fill="none" stroke="#9bb6bf" stroke-width="2"><path d="M598 24L610 12H648"/><path d="M1322 24L1310 12H1272"/></g>
 <!-- Wordmark: vector text, no external font dependencies -->
 <text x="960" y="52" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="900" letter-spacing="14" fill="url(#steel)" filter="url(#textShadow)">NÖMÄD</text>
 <path d="M755 60H850M1070 60H1165" stroke="url(#accent)" stroke-width="2" opacity=".85"/>
 <!-- Small tactical corner details are entirely inside header/footer -->
 <g stroke="#6d8793" fill="none" stroke-width="2" opacity=".7"><path d="M22 1028H210L222 1040H305"/><path d="M1898 1028H1710L1698 1040H1615"/></g>
 <g fill="#8198a3" font-family="Arial,Helvetica,sans-serif" font-size="15" letter-spacing="4" opacity=".9">
  <text x="36" y="1060">TACTICAL // LIVE</text>
  <text x="1884" y="1060" text-anchor="end">NÖMÄD // SYSTEM 01</text>
 </g>
 <g fill="none" stroke="#7b98a4" stroke-width="2" opacity=".75"><path d="M755 1043H875"/><path d="M1045 1043H1165"/></g>
 <path d="M929 1043H991" stroke="#a5c2c9" stroke-width="3"/>
 <path d="M955 1023L965 1033L955 1043L945 1033Z" fill="none" stroke="#a5c2c9" stroke-width="2"/>
</svg>
  <div id="marquee-slot" aria-live="off"><span id="marquee-message"></span></div>
  <div id="marquee-led"></div>
</div>
<div id="preview-tag">TRANSPARENCY PREVIEW — checkerboard is preview-only<br>Remove <code>?preview=1</code> for the live overlay.</div>
<script>
  // Self-contained and works on Apache, GitHub Pages, and file:// URLs.
  if(new URLSearchParams(location.search).get('preview')==='1') document.body.classList.add('preview');

  // V2: edit these lines to customize your broadcast announcements.
  const MARQUEE = {
    messages: [
      'ENJOYING THE STREAM? SUBSCRIBE!',
      'DROP A LIKE // SUPPORT NÖMÄD',
      'WELCOME TO THE NÖMÄD COMMUNITY',
      'THANK YOU FOR WATCHING // STAY TACTICAL',
      'SUBSCRIBE FOR MORE SOLO GRIND'
    ],
    intervalSeconds: 120, // Normal: one announcement every two minutes
    visibleSeconds: 9,
    firstDelaySeconds: 12
  };
  const params = new URLSearchParams(location.search);
  const demo = params.get('demo') === '1';
  const msg = document.getElementById('marquee-message');
  const led = document.getElementById('marquee-led');
  let messageIndex = 0;
  let busy = false;
  function announce(){
    if(busy || !MARQUEE.messages.length) return;
    busy = true;
    msg.classList.remove('visible','leaving');
    msg.textContent = MARQUEE.messages[messageIndex % MARQUEE.messages.length];
    messageIndex++;
    void msg.offsetWidth;
    requestAnimationFrame(()=>{msg.classList.add('visible');led.classList.add('active');});
    setTimeout(()=>{
      msg.classList.remove('visible');msg.classList.add('leaving');led.classList.remove('active');
      setTimeout(()=>{msg.classList.remove('leaving');busy=false;},800);
    },(demo ? 4 : MARQUEE.visibleSeconds)*1000);
  }
  setTimeout(()=>{
    announce();
    setInterval(announce,(demo ? 7 : MARQUEE.intervalSeconds)*1000);
  },(demo ? 1 : MARQUEE.firstDelaySeconds)*1000);
  // For testing: press M to trigger the next message immediately.
  document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='m') announce();});
</script>
</body>
</html>
